name: Playwright Real Project

on:
  push:
  workflow_dispatch:

env:
  MEMBER_URL: ${{ secrets.MEMBER_URL }}
  MEMBER_USERNAME: ${{ secrets.MEMBER_USERNAME }}
  MEMBER_PASSWORD: ${{ secrets.MEMBER_PASSWORD }}

  MERCHANT_URL: ${{ secrets.MERCHANT_URL }}
  MERCHANT_USERNAME: ${{ secrets.MERCHANT_USERNAME }}
  MERCHANT_PASSWORD: ${{ secrets.MERCHANT_PASSWORD }}
  MERCHANT_CODE: ${{ secrets.MERCHANT_CODE }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region-denied-screenshot
          path: debug.png
